{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#183c32">
    <title>{% block title %}Núcleo Acadêmico{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'aluno/management.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-mark"><i class="bi bi-mortarboard-fill" aria-hidden="true"></i></span>
                <span>Núcleo Acadêmico</span>
            </a>
            <nav class="navigation" aria-label="Navegação principal">
                <a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Painel</a>
                <a href="{% url 'aluno' %}"{% if request.resolver_match.url_name == 'aluno' or request.resolver_match.url_name == 'criar_aluno' or request.resolver_match.url_name == 'editar_aluno' or request.resolver_match.url_name == 'excluir_aluno' %} aria-current="page"{% endif %}>Alunos</a>
                <a href="{% url 'cursos' %}"{% if request.resolver_match.url_name == 'cursos' or request.resolver_match.url_name == 'criar_curso' or request.resolver_match.url_name == 'editar_curso' or request.resolver_match.url_name == 'excluir_curso' %} aria-current="page"{% endif %}>Cursos</a>
            </nav>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
