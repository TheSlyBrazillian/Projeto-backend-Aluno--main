<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 520px;">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white"><h1 class="h5 mb-0">Confirmar exclusão</h1></div>
            <div class="card-body">
                <p>Excluir o curso <strong>{{ curso.nome }}</strong>?</p>
                {% if curso.aluno_set.exists %}
                <p class="text-danger">Os alunos vinculados a este curso também serão excluídos.</p>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Excluir curso</button>
                    <a href="{% url 'cursos' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
